<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">yyyerin frontend developer banner</title>
  <desc id="desc">A dark developer terminal showing JavaScript code and console logs for yyyerin.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020" />
      <stop offset="1" stop-color="#15112A" />
    </linearGradient>
    <linearGradient id="accent" x1="80" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9" />
      <stop offset="0.5" stop-color="#A78BFA" />
      <stop offset="1" stop-color="#FB7185" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#050816" flood-opacity="0.45" />
    </filter>
    <clipPath id="windowClip">
      <rect x="42" y="36" width="1116" height="348" rx="18" />
    </clipPath>
  </defs>

  <rect width="1200" height="420" rx="24" fill="#060914" />
  <rect x="42" y="36" width="1116" height="348" rx="18" fill="url(#background)" stroke="#2B3551" stroke-width="2" filter="url(#shadow)" />

  <g clip-path="url(#windowClip)">
    <circle cx="72" cy="70" r="7" fill="#FB7185" />
    <circle cx="98" cy="70" r="7" fill="#FBBF24" />
    <circle cx="124" cy="70" r="7" fill="#34D399" />
    <text x="600" y="76" text-anchor="middle" fill="#64748B" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">~/portfolio/README.md</text>
    <path d="M42 102H1158" stroke="#2B3551" />

    <rect x="42" y="102" width="694" height="282" fill="#0D1426" fill-opacity="0.62" />
    <path d="M736 102V384" stroke="#2B3551" />

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
      <g fill="#475569" text-anchor="end">
        <text x="78" y="138">01</text>
        <text x="78" y="166">02</text>
        <text x="78" y="194">03</text>
        <text x="78" y="222">04</text>
        <text x="78" y="250">05</text>
        <text x="78" y="278">06</text>
        <text x="78" y="306">07</text>
        <text x="78" y="334">08</text>
        <text x="78" y="362">09</text>
      </g>

      <text x="104" y="138" fill="#C084FC">const</text>
      <text x="158" y="138" fill="#67E8F9">developer</text>
      <text x="260" y="138" fill="#CBD5E1">=</text>
      <text x="278" y="138" fill="#CBD5E1">{</text>

      <text x="128" y="166" fill="#94A3B8">name:</text>
      <text x="208" y="166" fill="#FCD34D">"yyyerin"</text>
      <text x="310" y="166" fill="#CBD5E1">,</text>

      <text x="128" y="194" fill="#94A3B8">role:</text>
      <text x="208" y="194" fill="#FCD34D">"Frontend Developer"</text>
      <text x="438" y="194" fill="#CBD5E1">,</text>

      <text x="128" y="222" fill="#94A3B8">focus:</text>
      <text x="208" y="222" fill="#CBD5E1">[</text>
      <text x="226" y="222" fill="#FCD34D">"UX"</text>
      <text x="274" y="222" fill="#CBD5E1">,</text>
      <text x="292" y="222" fill="#FCD34D">"Clean Code"</text>
      <text x="414" y="222" fill="#CBD5E1">],</text>

      <text x="128" y="250" fill="#94A3B8">motto:</text>
      <text x="208" y="250" fill="#FCD34D">"Build with care"</text>
      <text x="396" y="250" fill="#CBD5E1">,</text>

      <text x="104" y="278" fill="#CBD5E1">};</text>
      <text x="104" y="334" fill="#64748B">// turning ideas into useful interfaces</text>
      <rect x="104" y="349" width="9" height="18" rx="1" fill="#67E8F9" />
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
      <text x="778" y="138" fill="#64748B">$ whoami</text>
      <text x="778" y="166" fill="#67E8F9">yyyerin</text>
      <text x="778" y="212" fill="#64748B">$ console.log("hello, world!")</text>
      <text x="778" y="240" fill="#FCD34D">hello, world!</text>
      <text x="778" y="286" fill="#64748B">$ npm run build</text>
      <text x="778" y="314" fill="#34D399">✓ ready</text>
      <text x="864" y="314" fill="#94A3B8">in 1.2s</text>
      <text x="778" y="360" fill="#FB7185">→</text>
      <text x="802" y="360" fill="#CBD5E1">making the web feel a little better</text>
    </g>

    <circle cx="1102" cy="130" r="46" fill="#A78BFA" fill-opacity="0.09" />
    <circle cx="1102" cy="130" r="24" stroke="#A78BFA" stroke-opacity="0.35" />
    <path d="M1092 130L1099 137L1113 121" stroke="#A78BFA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <rect x="42" y="36" width="1116" height="4" rx="2" fill="url(#accent)" />
</svg>
